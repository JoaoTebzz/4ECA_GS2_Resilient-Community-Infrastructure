# Broker MQTT local do no de borda (um por espaco). NAO TESTADO no ambiente de desenvolvimento
# (o laboratorio usou edge/mtls_gateway.py como substituto); testar com docker compose antes da demo.
listener 8883
protocol mqtt
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/edge-server.crt
keyfile  /mosquitto/certs/edge-server.key
crlfile  /mosquitto/certs/crl.pem
tls_version tlsv1.2
require_certificate true
use_identity_as_username true
allow_anonymous false
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
