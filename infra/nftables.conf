#!/usr/sbin/nft -f
# Segmentacao do no de borda (menor privilegio). NAO TESTADO no ambiente de desenvolvimento.
# Segmentos:  iot  (sensores, fechaduras, rele)   10.20.10.0/24
#             ops  (operadores, painel local)      10.20.20.0/24
#             adm  (administracao, bastiao, SIEM)  10.20.30.0/24
#             wg0  (VPN para a nuvem)              10.50.0.0/24
flush ruleset
table inet filter {
  set blocklist { type ipv4_addr; flags interval; }   # alimentado pelo SOAR

  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    iif lo accept
    ip saddr @blocklist drop
    # MQTT com mTLS so vindo dos dispositivos IoT
    ip saddr 10.20.10.0/24 tcp dport 8883 accept
    # painel local so para operadores
    ip saddr 10.20.20.0/24 tcp dport 443 accept
    # SSH so do segmento de administracao e da VPN
    ip saddr { 10.20.30.0/24, 10.50.0.0/24 } tcp dport 22 accept
    # WireGuard (UDP) e a unica porta aberta para fora
    udp dport 51820 accept
    icmp type echo-request limit rate 5/second accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept
    # IoT nunca inicia conexao para ops ou adm
    ip saddr 10.20.10.0/24 ip daddr { 10.20.20.0/24, 10.20.30.0/24 } drop
    # ops fala com iot so para consulta (ler estado), nunca comandar direto: comando passa pela borda
    ip saddr 10.20.20.0/24 ip daddr 10.20.10.0/24 drop
    # logs: adm e borda enviam ao SIEM pela VPN
    ip saddr 10.20.0.0/16 ip daddr 10.50.0.10 tcp dport { 1514, 1515 } accept
  }
}
