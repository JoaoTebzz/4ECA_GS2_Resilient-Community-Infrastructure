# Ambiente de laboratorio (infraestrutura como codigo). NAO TESTADO no ambiente de desenvolvimento:
# rode "docker compose up" e confira os logs antes de gravar o video.
# Redes separadas: iot, ops, adm. O prototipo usa SQLite; em producao o painel usaria PostgreSQL (ver E1).
services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./acl:/mosquitto/config/acl:ro
      - ../pki/out/ca/ca.crt:/mosquitto/certs/ca.crt:ro
      - ../pki/out/ca/crl.pem:/mosquitto/certs/crl.pem:ro
      - ../pki/out/devices/edge-server.crt:/mosquitto/certs/edge-server.crt:ro
      - ../pki/out/devices/edge-server.key:/mosquitto/certs/edge-server.key:ro
    ports: ["8883:8883"]
    networks: [iot, adm]
  painel:
    build: { context: .., dockerfile: infra/Dockerfile.painel }
    environment:
      VA_LOGS: /logs
    volumes: ["../logs:/logs"]
    ports: ["127.0.0.1:5002:5002"]     # so local; acesso remoto pela VPN
    networks: [ops, adm]
networks:
  iot: { internal: true }
  ops: {}
  adm: { internal: true }
